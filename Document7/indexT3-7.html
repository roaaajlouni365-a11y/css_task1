<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styleT3-7.css">
</head>
<body>
    <!-- 1. Position Static -->
<div class="section">
  <h3>position: static</h3>
  <div class="container">
    <div class="box red">One</div>
    <div class="box green">Two</div>
    <div class="box red">Three</div>
    <div class="box red">Four</div>
  </div>
</div>

<!-- 2. Position Relative -->
<div class="section">
  <h3>position: relative</h3>
  <div class="container">
    <div class="box red">One</div>
    <div class="box green box-relative">Two</div>
    <div class="box red">Three</div>
    <div class="box red">Four</div>
  </div>
</div>

<!-- 3. Position Absolute -->
<div class="section">
  <h3>position: absolute</h3>
  <div class="container container-relative">
    <div class="box red">One</div>
    <div class="box green box-absolute">Two</div>
    <div class="box red">Three</div>
    <div class="box red">Four</div>
  </div>
</div>
</body>
</html>
