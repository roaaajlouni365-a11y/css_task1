<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .div {
    display: grid;
    /* إنشاء 3 أعمدة متساوية */
    grid-template-columns: repeat(3, 1fr);
    /* تحديد المسافة (الفراغ الأبيض) بين الصور */
    gap: 15px;
    /* توسيط الحاوية وتحديد أقصى عرض لها */
    max-width: 100px;
    margin: 20px auto;
}

.div1 {
    width: 100%;
    /* توحيد ارتفاع جميع الصور */
    height: 250px;
    /* ملء المساحة بالكامل بدون ضغط أو تشويه الصورة */
    object-fit: cover;
}
    </style>
</head>

<body>

    <div>
        <img src="p1.jpeg" alt="" class="div1">
        <img src="p2.jpeg" alt="" class="div1">
        <img src="p3.jpeg" alt="" class="div1">
        <img src="p4.jpeg" alt="" class="div1">
        <img src="p5.jpeg" alt="" class="div1">
        <img src="p6.jpeg" alt="" class="div1">
        <img src="p7.jpeg" alt="" class="div1">
        <img src="p8.jpeg" alt="" class="div1">

    
    </div>

</body>

</html>
